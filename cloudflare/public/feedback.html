<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户反馈 · AI Quota Bar</title><meta name="description" content="查看 AI Quota Bar 用户的反馈与留言，也可以在这里提交你的建议和联系方式。"><link rel="canonical" href="https://ai-quota-bar.pages.dev/feedback"><link rel="alternate" hreflang="zh-CN" href="https://ai-quota-bar.pages.dev/feedback"><link rel="alternate" hreflang="en" href="https://ai-quota-bar.pages.dev/en/feedback"><link rel="alternate" hreflang="x-default" href="https://ai-quota-bar.pages.dev/feedback"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/feedback.css"><script src="/feedback-locale-zh-1.js"></script><script src="/feedback.js" defer></script><script src="/language-links.js" defer></script></head><body><header><a href="/">AI Quota Bar</a><span>用户反馈</span><a class="lang-switch" href="/en/feedback" data-language="en">EN</a></header><main>
<div class="page-heading"><div><p class="eyebrow">USER FEEDBACK</p><h1>听听你的想法。</h1><p class="muted">来自 App「设置 → 关于」和本页面的反馈会同步展示在下方。留言提交后立即公开；联系方式仅开发者可见。</p></div></div>
<p id="wall-error" role="alert" hidden>反馈加载失败，请稍后刷新重试。</p>
<div class="columns">
<section class="card" aria-labelledby="submit-title"><p class="eyebrow">LEAVE A MESSAGE</p><h2 id="submit-title">留下一条反馈。</h2><p>功能建议、使用问题或想吐槽的都可以写。想收到回复就留下联系方式。</p>
<form id="feedback-form"><label for="nickname">昵称（可选）</label><input id="nickname" name="nickname" maxlength="30" autocomplete="off"><label for="contact">联系方式（可选）</label><input id="contact" name="contact" maxlength="120" autocomplete="off"><p class="hint">仅开发者可见，不会公开展示，也不会用于其他用途。</p><label for="message">留言内容</label><textarea id="message" name="message" maxlength="1000" rows="5" required></textarea><button class="primary" type="submit">发布反馈 →</button></form><p id="submit-error" role="alert"></p><p id="submit-success" class="success" role="status" hidden>已发布，感谢你的反馈！</p></section>
<section class="wall" aria-labelledby="wall-title"><div class="section-heading"><h2 id="wall-title">反馈墙</h2><p class="muted">共 <span id="count">0</span> 条</p></div><p id="wall-empty" class="empty" hidden>还没有反馈，来坐第一个沙发吧。</p><ol id="feedback-list"></ol><div class="wall-tools"><button id="more" type="button" hidden>加载更多</button><button id="refresh" type="button">刷新</button></div></section>
</div>
</main><footer>AI Quota Bar · 用户反馈 · 联系方式仅开发者可见，不会公开展示</footer></body></html>
